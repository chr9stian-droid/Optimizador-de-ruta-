<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta Repartidor Pro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body style="font-family:Arial;background:#020617;color:white;margin:0;padding:10px;">

<h2 style="text-align:center;color:#22d3ee;margin:8px;">🚚 OPTIMIZADOR DE ENTREGAS</h2>
<p style="text-align:center;color:#64748b;font-size:12px;margin:0 0 10px;">Mete tus entregas y te ordena del más cerca al más lejos</p>

<div style="max-width:550px;margin:0 auto;background:#0f172a;padding:12px;border-radius:15px;">
  <div style="display:flex;gap:6px;margin-bottom:8px;">
    <input id="nuevaDir" placeholder="Ej: Blvd Torres Landa 303 León, o pega dirección completa" style="flex:1;padding:12px;border-radius:10px;border:none;">
    <button onclick="agregar()" style="padding:12px 15px;background:#22d3ee;color:black;border:none;border-radius:10px;font-weight:bold;">+ ADD</button>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;">
    <button onclick="usarMiUbic()" style="padding:10px;background:#1e293b;color:white;border:none;border-radius:8px;font-size:12px;">📍 Usar mi ubicación como INICIO</button>
    <button onclick="optimizar()" style="padding:10px;background:#facc15;color:black;border:none;border-radius:8px;font-weight:bold;font-size:13px;">⚡ OPTIMIZAR RUTA</button>
  </div>
  <div id="lista" style="background:#020617;border-radius:10px;padding:8px;max-height:160px;overflow:auto;"></div>
  <button onclick="limpiar()" style="margin-top:8px;width:100%;padding:8px;background:#1e293b;color:#94a3b8;border:none;border-radius:8px;font-size:12px;">Limpiar todo</button>
</div>

<div id="map" style="height:350px;border-radius:15px;margin:10px auto;max-width:550px;"></div>

<div id="rutaInfo" style="display:none;max-width:550px;margin:0 auto;background:white;color:black;padding:15px;border-radius:15px;">
  <h3 style="margin:0 0 10px;">📋 Orden inteligente para ahorrar gasolina:</h3>
  <div id="ordenLista"></div>
  <div style="margin-top:12px;padding:10px;background:#f1f5f9;border-radius:10px;text-align:center;">
    <b id="totalKm" style="font-size:22px;"></b><br>
    <small id="totalTiempo" style="color:gray;"></small>
  </div>
  <a id="btnGoogle" target="_blank" style="display:block;margin-top:10px;padding:12px;background:#020617;color:white;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold;">Abrir ruta completa en Google Maps</a>
</div>

<p id="status" style="text-align:center;color:#38bdf8;font-size:12px;max-width:550px;margin:10px auto;"></p>

<script>
let map=L.map('map').setView([21.1221, -101.68], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let entregas=[], inicio=null, markers=[], rutaLine=null;

function renderLista(){
  let html=entregas.map((e,i)=>`<div style="display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #1e293b;font-size:13px;"><span>${i+1}. ${e.texto}</span><span onclick="eliminar(${i})" style="color:#ef4444;cursor:pointer;">❌</span></div>`).join('');
  document.getElementById('lista').innerHTML=html||'<small style="color:gray;">No hay entregas. Agrega 5 o 10</small>';
  pintarMarcadores();
}
function eliminar(i){ entregas.splice(i,1); renderLista(); }
function limpiar(){ entregas=[]; inicio=null; markers.forEach(m=>map.removeLayer(m)); markers=[]; if(rutaLine) map.removeLayer(rutaLine); renderLista(); document.getElementById('rutaInfo').style.display='none'; document.getElementById('status').innerText=''; }

async function geocode(txt){
  let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(txt)}&limit=1&countrycodes=mx`);
  let j=await r.json();
  if(j.length==0) throw txt;
  return {lat:parseFloat(j[0].lat), lon:parseFloat(j[0].lon), display:j[0].display_name};
}

async function agregar(){
  let txt=document.getElementById('nuevaDir').value.trim();
  if(!txt) return;
  document.getElementById('status').innerText='Buscando dirección...';
  try{
    let g=await geocode(txt);
    entregas.push({texto:txt, lat:g.lat, lon:g.lon, display:g.display});
    document.getElementById('nuevaDir').value='';
    document.getElementById('status').innerText='Agregada: '+txt;
    renderLista();
  }catch(e){ document.getElementById('status').innerText='No encontré: '+e+' - Intenta poner colonia y ciudad'; }
}

async function usarMiUbic(){
  document.getElementById('status').innerText='Obteniendo GPS...';
  navigator.geolocation.getCurrentPosition(pos=>{
    inicio={lat:pos.coords.latitude, lon:pos.coords.longitude, texto:'MI UBICACIÓN (INICIO)'};
    document.getElementById('status').innerText='Inicio puesto en tu ubicación actual';
    pintarMarcadores();
  });
}

function pintarMarcadores(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  if(inicio){ let m=L.marker([inicio.lat,inicio.lon],{icon:L.divIcon({html:'🏠',className:'',iconSize:[25,25]})}).addTo(map).bindPopup('INICIO'); markers.push(m); }
  entregas.forEach((e,i)=>{ let m=L.marker([e.lat,e.lon]).addTo(map).bindPopup((i+1)+'. '+e.texto); markers.push(m); });
  if(markers.length>0){ let group=L.featureGroup(markers); map.fitBounds(group.getBounds(),{padding:[30,30]}); }
}

// OPTIMIZACION TSP con OSRM
async function optimizar(){
  if(entregas.length<2){ document.getElementById('status').innerText='Mete mínimo 2 entregas'; return; }
  if(!inicio){ document.getElementById('status').innerText='Primero pon tu ubicación como INICIO con el botón'; return; }

  document.getElementById('status').innerText='Calculando ruta más corta... esto tarda 10 seg si son 10 entregas';

  // Crear string para OSRM trip (resuelve el viajero)
  let coords=[inicio,...entregas].map(p=>`${p.lon},${p.lat}`).join(';');
  let url=`https://router.project-osrm.org/trip/v1/driving/${coords}?source=first&destination=last&roundtrip=false&overview=full&geometries=geojson&steps=true`;
  // Si no ponemos destination last, nos regresa al inicio, mejor sin retorno
  url=`https://router.project-osrm.org/trip/v1/driving/${coords}?source=first&roundtrip=false&overview=full&geometries=geojson`;

  try{
    let r=await fetch(url);
    let j=await r.json();
    if(j.code!='Ok'){ throw 'Error ruta'; }

    let trip=j.trips[0];
    let orden=j.waypoints; // orden optimizado

    // Mapear orden
    let entregasOrdenadas=[];
    orden.forEach(w=>{
      if(w.waypoint_index==0) return; // es el inicio
      entregasOrdenadas.push(entregas[w.waypoint_index-1]);
    });

    // Dibujar ruta
    if(rutaLine) map.removeLayer(rutaLine);
    rutaLine=L.geoJSON(trip.geometry,{style:{color:'#22d3ee',weight:5}}).addTo(map);
    map.fitBounds(rutaLine.getBounds(),{padding:[20,20]});

    // Mostrar lista ordenada
    document.getElementById('rutaInfo').style.display='block';
    let html=entregasOrdenadas.map((e,i)=>{
      let dist = i==0? distancia(inicio,e) : distancia(entregasOrdenadas[i-1], e);
      return `<div style="padding:8px;border-left:4px solid #22d3ee;margin-bottom:6px;background:#f8fafc;border-radius:6px;"><b>${i+1}° PARADA:</b> ${e.texto}<br><small style="color:gray;">${e.display.substring(0,70)}... | a ${ (dist/1000).toFixed(1)}km de la anterior</small><br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${e.lat},${e.lon}" style="font-size:12px;color:#0ea5e9;">Ir aquí →</a></div>`;
    }).join('');
    document.getElementById('ordenLista').innerHTML=html;
    document.getElementById('totalKm').innerText=(trip.distance/1000).toFixed(2)+' km totales';
    document.getElementById('totalTiempo').innerText=`${Math.round(trip.duration/60)} minutos manejando | Ahorras hasta 40% vs ir en desorden`;

    // Link para toda la ruta en Google
    let gLink=`https://www.google.com/maps/dir/${inicio.lat},${inicio.lon}/`+entregasOrdenadas.map(e=>`${e.lat},${e.lon}`).join('/')+'/';
    document.getElementById('btnGoogle').href=gLink;
    document.getElementById('status').innerText='¡Ruta optimizada! Ve en el orden que te puse';

  }catch(e){
    // Fallback: orden por distancia al inicio (nearest)
    document.getElementById('status').innerText='Usando método simple por cercanía (el servidor de rutas está saturado)';
    let copia=[...entregas];
    copia.sort((a,b)=>distancia(inicio,a)-distancia(inicio,b));
    // mostrar
    document.getElementById('rutaInfo').style.display='block';
    document.getElementById('ordenLista').innerHTML=copia.map((e,i)=>`<div style="padding:8px;border-left:4px solid #facc15;margin-bottom:6px;background:#f8fafc;"><b>${i+1}°</b> ${e.texto} - ${(distancia(inicio,e)/1000).toFixed(1)}km de ti</div>`).join('');
  }
}

function distancia(a,b){
  const R=6371000;
  const dLat=(b.lat-a.lat)*Math.PI/180;
  const dLon=(b.lon-a.lon)*Math.PI/180;
  const x=Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
</script>
</body>
</html>
